name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---------- Frontend ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npx vite build

      # ---------- Backend ----------
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Build Go binary
        working-directory: backend
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/nova-server ./cmd/server/

      # ---------- Deploy ----------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync frontend dist
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/www/wwwroot/novanurachman.my.id/frontend/dist/

      - name: Rsync Go binary
        run: |
          rsync -avz --chmod=F755 \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            backend/bin/nova-server \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/www/wwwroot/novanurachman.my.id/backend/bin/nova-server

      - name: Restart service & clear nginx cache
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo systemctl restart nova-server && \
             sudo rm -rf /www/server/nginx/proxy_cache_dir/* 2>/dev/null; \
             sudo /www/server/nginx/sbin/nginx -s reload"

      - name: Verify deployment
        run: |
          sleep 5
          for path in / /projects /experience /skills /contact; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "https://novanurachman.my.id$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$path returned $code"
              exit 1
            fi
          done
